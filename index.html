x #0003}.modal h2{margin:0 0 17px}.formgrid{display:grid;gap:12px}.formgrid label{display:grid;gap:6px;font-size:12px;color:#657287;font-weight:700}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.qr{width:70px;height:70px;border:7px solid white;outline:1px solid #dce2eb;background:repeating-conic-gradient(#172033 0 25%,white 0 50%) 0/12px 12px;margin:12px 0}.mobilemenu{display:none}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calendar>b{text-align:center;color:#8490a2;font-size:12px;padding:8px}.calday{min-height:58px;background:#f5f7fa;border:1px solid #e6ebf1;border-radius:8px;padding:7px;font-size:13px}.calday.today{border:2px solid #e5a43a}.calday small{display:block;color:#a66a12;font-size:10px;margin-top:5px}.searchhit{padding:10px;border-bottom:1px solid #eef1f5;display:grid;gap:3px;font-size:13px}.searchhit small{color:#758197}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calendar>b{text-align:center;color:#8490a2;font-size:12px;padding:8px}.calday{min-height:58px;background:#f5f7fa;border:1px solid #e6ebf1;border-radius:8px;padding:7px;font-size:13px}.calday.today{border:2px solid #e5a43a}.calday small{display:block;color:#a66a12;font-size:10px;margin-top:5px}.searchhit{padding:10px;border-bottom:1px solid #eef1f5;display:grid;gap:3px;font-size:13px}.searchhit small{color:#758197}
.top{gap:14px}.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.top-actions button{white-space:nowrap;font-size:12px;padding:9px 11px;min-height:38px}.user{white-space:nowrap}
@media(max-width:620px){.top{height:auto;min-height:72px;padding:10px 14px;display:grid;grid-template-columns:1fr;gap:8px}.crumb{font-size:12px;white-space:nowrap}.top-actions{justify-content:flex-start;display:grid;grid-template-columns:auto auto 1fr;gap:7px}.top-actions button{font-size:11px;padding:8px 9px}.user{justify-self:end;font-size:11px;padding:8px 10px}.brand img{width:110px!important}.side{gap:9px}.nav{max-width:100%;padding-bottom:2px;scrollbar-width:thin}.nav button{flex:0 0 auto;font-size:12px;padding:9px 10px}}

<body>
<div class="shell">
<aside class="side"><div class="brand" style="padding:0 8px;display:flex;align-items:center;gap:12px"><img src="/assets/decobygg-logo.jpg" alt="Original DEKOBYGG AS logo" style="display:block;width:76px;max-width:28vw;height:auto;object-fit:contain;background:#fff;border-radius:4px;image-rendering:auto;flex:none"><span style="font-size:17px;font-weight:800;color:#fff">DecoTrack</span></div><nav class="nav" id="nav">
<button class="active" data-page="Apžvalga">▦ &nbsp; Apžvalga</button><button data-page="Įrankiai">▤ &nbsp; Įrankiai</button><button data-page="Įrankių krepšiai">▣ &nbsp; Įrankių krepšiai</button><button data-page="Projektai">⌂ &nbsp; Projektai</button><button data-page="Perdavimai">⇄ &nbsp; Perdavimai</button>
</nav><div class="sidefoot">DEKOBYGG AS · DecoTrack v0.1.2<br>Demonstracinė aplinka · Pavyzdiniai duomenys</div></aside>

</div><div id="modalroot"></div>
<script>
const data={
tools:[
{id:"DT-001",name:"Makita impact driver",category:"Elektriniai įrankiai",holder:"Jonas",location:"Project Oslo",status:"Naudojamas"},
{id:"DT-002",name:"DeWalt circular saw",category:"Elektriniai įrankiai",holder:"Marius",location:"Project Lillestrøm",status:"Naudojamas"},
{id:"DT-003",name:"Laser level",category:"Measuring",holder:"Įrankis room",location:"Warehouse",status:"Laisvas"},
{id:"DT-004",name:"Hilti rotary hammer",category:"Elektriniai įrankiai",holder:"Kammas",location:"Project Oslo",status:"Naudojamas"},
{id:"DT-005",name:"Festool dust extractor",category:"Dust control",holder:"Įrankis room",location:"Warehouse",status:"Reikia priežiūros"},
{id:"DT-006",name:"Extension ladder 3.2m",category:"Access",holder:"Eirik",location:"Project Drammen",status:"Naudojamas"}
],
bags:[
{id:"BAG-01",name:"Carpenter bag 01",holder:"Jonas",project:"Project Oslo",items:["DT-001","DT-004"]},
{id:"BAG-02",name:"Electrician bag 02",holder:"Marius",project:"Project Lillestrøm",items:["DT-002"]},
{id:"BAG-03",name:"Shared measuring kit",holder:"Įrankis room",project:"Warehouse",items:["DT-003"]}
],
projects:[
{id:"P-01",name:"Project Oslo",site:"Oslo",lead:"Jonas",people:12,items:["DT-001","DT-004"]},
{id:"P-02",name:"Project Lillestrøm",site:"Lillestrøm",lead:"Marius",people:8,items:["DT-002"]},
{id:"P-03",name:"Project Drammen",site:"Drammen",lead:"Eirik",people:6,items:["DT-006"]}
],
transfers:[{id:"TR-104",item:"DT-002 · DeWalt circular saw",from:"Project Oslo",to:"Project Lillestrøm",by:"Marius",status:"Užbaigta",date:"Kamday, 08:42"},{id:"TR-103",item:"DT-006 · Extension ladder 3.2m",from:"Warehouse",to:"Project Drammen",by:"Eirik",status:"Užbaigta",date:"Vakar, 14:10"}]
};
let page="Apžvalga",query="",language="lt",darkMode=false; try{const saved=localStorage.getItem("decotrack-demo-v1");if(saved)Object.assign(data,JSON.parse(saved))}catch(e){}
function clearSearch(){query="";render()}
const translations=[
["Darbo aplinka","Workspace"],["Apžvalga","Overview"],["Įrankiai","Tools"],["Įrankių krepšiai","Tool bags"],["Projektai","Projects"],["Perdavimai","Transfers"],["Demo vadovas","Demo manager"],["Sveiki, vadove","Good morning, Manager"],["Štai jūsų įrankių ir įrangos apžvalga šiandien.","Here is your equipment overview for today."],["Pridėti įrankį","Add tool"],["IŠ VISO ĮRANKIŲ","TOTAL TOOLS"],["NAUDOJAMI","IN USE"],["LAISVI","AVAILABLE"],["REIKIA DĖMESIO","NEEDS ATTENTION"],["Užregistruota įranga","Registered equipment"],["Priskirta darbuotojams arba objektams","Assigned to employees or sites"],["Galima priskirti","Ready to assign"],["Reikalinga techninė priežiūra","Maintenance required"],["Įranga pagal vietą","Equipment by location"],["Naujausia veikla","Recent activity"],["Sandėlis","Warehouse"],["Įrankių krepšiai","Tool bags"],["Sunumeruoti krepšiai ir juose esantys įrankiai.","Numbered bags and the tools inside."],["Naujas krepšys","New bag"],["Krepšio ID:","Bag ID:"],["Atsakingas:","Responsible:"],["Vieta:","Location:"],["Peržiūrėti turinį","View contents"],["Įrankiai ir komandos kiekviename darbo objekte.","Tools and teams at each work site."],["Pridėti objektą","Add project"],["Objektas:","Site:"],["Objekto vadovas:","Project lead:"],["Komandos nariai:","Team members:"],["Peržiūrėti informaciją","View details"],["Perduokite įrangą darbuotojams, objektams arba sandėliui.","Move equipment between employees, projects and the warehouse."],["Sukurti įrangos perdavimą","Create equipment transfer"],["Perdavimas","Transfer"],["Įranga","Equipment"],["Iš","From"],["Kam","To"],["Perdavė","Handled by"],["Būsena","Status"],["Data","Date"],["Užbaigta","Completed"],["Naudojamas","In use"],["Laisvas","Available"],["Reikia priežiūros","Service due"],["Užregistruoti įrankį","Register a tool"],["Įrankis","Tool"],["Įrankio ID","Asset ID"],["Priskirtas","Assigned to"],["Ieškoti pagal įrankį, ID, darbuotoją arba vietą…","Search by tool, ID, employee or location…"],["Išvalyti paiešką","Clear search"],["Registruokite ir raskite kiekvieną įrankį.","Register and find every piece of equipment."],["Įrankių nerasta.","No matching tools found."],["Kategorija","Category"],["Priskirtas","Assigned to"],["Vieta","Location"],["Atšaukti","Cancel"],["Išsaugoti","Save"],["Krepšio pavadinimas","Bag name"],["Atsakingas asmuo","Responsible person"],["Objekto pavadinimas","Project name"],["Objektas / miestas","Site / city"],["Darbuotojo vardas","Employee name"],["Komandos dydis","Team size"],["Dabartinė vieta","Current location"],["Objektas arba darbuotojas","Project or employee"],["Ką tik","Just now"],["Įrankiai dar nepriskirti","No tools assigned yet"],["Įranga dar nepriskirta","No equipment assigned yet"],["Peržiūrėti","View"],["Elektriniai įrankiai","Power tools"],["Labas rytas","Good morning"]
];
function translateText(s){if(language!=="en")return s;for(const [lt,en] of translations)s=s.split(lt).join(en);return s}
function translatePage(){document.documentElement.lang=language;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement&&n.parentElement.closest("script,style"))continue;n.nodeValue=translateText(n.nodeValue)}document.querySelectorAll("input[placeholder],button[title]").forEach(e=>{if(e.placeholder)e.placeholder=translateText(e.placeholder);if(e.title)e.title=translateText(e.title)});el("langToggle").textContent=language==="lt"?"EN":"LT";el("themeToggle").textContent=darkMode?"☀️ Light mode":(language==="lt"?"🌙 Tamsus režimas":"🌙 Dark mode")}
function toggleLanguage(){language=language==="lt"?"en":"lt";render()}
function toggleTheme(){darkMode=!darkMode;document.body.classList.toggle("dark",darkMode);translatePage()}
const el=id=>document.getElementById(id);
function pill(s){return '<span class="pill '+(s==="Reikia priežiūros"?"warn":s==="Laisvas"?"blue":"")+'">'+s+'</span>'}
function stats(){return '<div class="stats"><div class="stat"><label>IŠ VISO ĮRANKIŲ</label><strong>'+data.tools.length+'</strong><small>Užregistruota įranga</small></div><div class="stat"><label>NAUDOJAMI</label><strong>'+data.tools.filter(x=>x.status==="Naudojamas").length+'</strong><small>Priskirta darbuotojams arba objektams</small></div><div class="stat"><label>LAISVI</label><strong>'+data.tools.filter(x=>x.status==="Laisvas").length+'</strong><small>Galima priskirti</small></div><div class="stat"><label>REIKIA DĖMESIO</label><strong>'+data.tools.filter(x=>x.status==="Reikia priežiūros").length+'</strong><small>Reikalinga techninė priežiūra</small></div></div>'}
function overview(){return '<div class="heading"><div><h1>Sveiki, vadove</h1><div class="muted">Štai jūsų įrankių ir įrangos apžvalga šiandien.</div></div><button class="primary" onclick="openAdd()">＋ Pridėti įrankį</button></div>'+stats()+'<div class="grid2"><div class="panel"><h3>Įranga pagal vietą</h3>'+data.projects.map(p=>'<div class="barrow"><span>'+p.site+'</span><div class="bar"><i style="width:'+Math.min(100,p.items.length*25)+'%"></i></div><b>'+p.items.length+'</b></div>').join('')+'<div class="barrow"><span>Warehouse</span><div class="bar"><i style="width:25%"></i></div><b>'+data.tools.filter(t=>t.location==="Warehouse").length+'</b></div></div><div class="panel"><h3>Naujausia veikla</h3><div class="activity">'+data.transfers.slice(0,4).map(t=>'<div class="event"><span class="dot"></span><div><b>'+t.item.split(" · ")[0]+'</b> moved to '+t.to+'<br><span>'+t.date+' · '+t.by+'</span></div></div>').join('')+'</div></div></div>'}
function toolsPage(){let rows=data.tools.filter(t=>(t.name+" "+t.id+" "+t.holder+" "+t.location).toLowerCase().includes(query.toLowerCase()));return '<div class="heading"><div><h1>Įrankiai</h1><div class="muted">Registruokite ir raskite kiekvieną įrankį.</div></div><button class="primary" onclick="openAdd()">＋ Pridėti įrankį</button></div><div class="toolbar"><input placeholder="Ieškoti pagal įrankį, ID, darbuotoją arba vietą…" value="'+query.replace(/"/g,'&quot;')+'" oninput="query=this.value;renderRows()"><button class="secondary" onclick="clearSearch()">Išvalyti paiešką</button></div><div id="toolrows">'+toolTable(rows)+'</div>'}
function toolTable(rows){return '<div class="tablewrap"><table><thead><tr><th>Įrankis</th><th>Įrankio ID</th><th>Priskirtas</th><th>Vieta</th><th>Būsena</th></tr></thead><tbody>'+rows.map(t=>'<tr><td class="strong">'+t.name+'</td><td>'+t.id+'</td><td>'+t.holder+'</td><td>'+t.location+'</td><td>'+pill(t.status)+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">Įrankių nerasta.</div>')+'</div>'}
function renderRows(){let root=el("toolrows");if(root)root.innerHTML=toolTable(data.tools.filter(t=>(t.name+" "+t.id+" "+t.holder+" "+t.location).toLowerCase().includes(query.toLowerCase())))}
function bagsPage(){return '<div class="heading"><div><h1>Įrankių krepšiai</h1><div class="muted">Sunumeruoti krepšiai ir juose esantys įrankiai.</div></div><button class="primary" onclick="openBag()">＋ Naujas krepšys</button></div><div class="cards">'+data.bags.map(b=>'<article class="asset"><h3>'+b.name+'</h3><p>Krepšio ID: '+b.id+'<br>Atsakingas: '+b.holder+'<br>Vieta: '+b.project+'</p><div class="meta"><span class="pill blue">'+b.items.length+' tools</span><button class="secondary" onclick="showBag(\''+b.id+'\')">Peržiūrėti turinį</button></div></article>').join('')+'</div>'}
function projectsPage(){return '<div class="heading"><div><h1>Projektai</h1><div class="muted">Įrankiai ir komandos kiekviename darbo objekte.</div></div><button class="primary" onclick="openProject()">＋ Pridėti objektą</button></div><div class="cards">'+data.projects.map(p=>'<article class="asset"><h3>'+p.name+'</h3><p>Objektas: '+p.site+'<br>Objekto vadovas: '+p.lead+'<br>Komandos nariai: '+p.people+'</p><div class="meta"><span class="pill blue">'+p.items.length+' priskirti įrankiai</span><button class="secondary" onclick="showProject(\''+p.id+'\')">Peržiūrėti informaciją</button></div></article>').join('')+'</div>'}
function transfersPage(){return '<div class="heading"><div><h1>Perdavimai</h1><div class="muted">Perduokite įrangą darbuotojams, objektams arba sandėliui.</div></div><button class="primary" onclick="openPerdavimas()">＋ New transfer</button></div><div class="tablewrap"><table><thead><tr><th>Perdavimas</th><th>Įranga</th><th>Iš</th><th>Kam</th><th>Perdavė</th><th>Būsena</th><th>Data</th></tr></thead><tbody>'+data.transfers.map(t=>'<tr><td>'+t.id+'</td><td class="strong">'+t.item+'</td><td>'+t.from+'</td><td>'+t.to+'</td><td>'+t.by+'</td><td>'+pill(t.status)+'</td><td>'+t.date+'</td></tr>').join('')+'</tbody></table></div>'}
function render(){try{localStorage.setItem("decotrack-demo-v1",JSON.stringify(data))}catch(e){} el("crumb").textContent=page;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));el("content").innerHTML=({Apžvalga:overview,Įrankiai:toolsPage,"Įrankių krepšiai":bagsPage,Projektai:projectsPage,Perdavimai:transfersPage,Kalendorius:calendarPage})[page]();translatePage()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;query="";render()}));
function modal(title,body,submit){el("modalroot").innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>'+title+'</h2><form class="formgrid" onsubmit="event.preventDefault();('+submit+')()">'+body+'<div class="modalactions"><button type="button" class="secondary" onclick="closeModal()">Atšaukti</button><button class="primary">Išsaugoti</button></div></form></div></div>'}
function closeModal(){el("modalroot").innerHTML=""}
function openAdd(){modal("Užregistruoti įrankį",'<label>Įrankis name<input id="fName" required placeholder="pvz., Makita suktuvas"></label><label>Kategorija<input id="fCat" required placeholder="Elektriniai įrankiai"></label><label>Priskirtas<input id="fHolder" value="Įrankis room"></label><label>Vieta<input id="fLoc" value="Warehouse"></label>',"saveĮrankis")}
function saveĮrankis(){let n=el("fName").value;data.tools.unshift({id:"DT-"+String(data.tools.length+1).padStart(3,"0"),name:n,category:el("fCat").value,holder:el("fHolder").value,location:el("fLoc").value,status:"Laisvas"});closeModal();render()}
function openPerdavimas(){modal("Sukurti įrangos perdavimą",'<label>Įrankis<select id="fĮrankis">'+data.tools.map(t=>'<option value="'+t.id+'">'+t.id+' · '+t.name+'</option>').join('')+'</select></label><label>Iš<input id="fIš" placeholder="Dabartinė vieta"></label><label>Kam<input id="fKam" required placeholder="Objektas arba darbuotojas"></label><label>Perdavė<input id="fBy" value="Demo vadovas"></label><label>Perdavimo data ir laikas<input id="fDate" type="datetime-local" value="2026-11-01T19:35" required></label>',"savePerdavimas")}
function savePerdavimas(){let t=data.tools.find(x=>x.id===el("fĮrankis").value),to=el("fKam").value,from=el("fIš").value||t.location;t.location=to;t.holder=to;t.status="Naudojamas";data.transfers.unshift({id:"TR-"+(105+data.transfers.length),item:t.id+" · "+t.name,from,to,by:el("fBy").value,status:"Užbaigta",date:el("fDate").value||new Date().toISOString()});closeModal();page="Perdavimai";render()}
function openBag(){modal("Sukurti įrankių krepšį",'<label>Krepšio pavadinimas<input id="fBag" required placeholder="e.g. Carpenter bag 04"></label><label>Atsakingas asmuo<input id="fBagHolder" value="Įrankis room"></label><label>Vieta<input id="fBagLoc" value="Warehouse"></label>',"saveBag")}
function saveBag(){data.bags.push({id:"BAG-"+String(data.bags.length+1).padStart(2,"0"),name:el("fBag").value,holder:el("fBagHolder").value,project:el("fBagLoc").value,items:[]});closeModal();render()}
function openProject(){modal("Pridėti objektą",'<label>Objekto pavadinimas<input id="fProject" required placeholder="Project Bergen"></label><label>Objektas / miestas<input id="fSite" required placeholder="Bergen"></label><label>Project lead<input id="fLead" placeholder="Darbuotojo vardas"></label><label>Komandos dydis<input id="fPeople" type="number" value="1" min="1"></label>',"saveProject")}
function saveProject(){data.projects.push({id:"P-"+String(data.projects.length+1).padStart(2,"0"),name:el("fProject").value,site:el("fSite").value,lead:el("fLead").value,people:Number(el("fPeople").value),items:[]});closeModal();render()}

function fmtDate(v){const d=new Date(v);return isNaN(d)?v:d.toLocaleString(language==="lt"?"lt-LT":"en-GB",{dateStyle:"medium",timeStyle:"short"})}
function calendarPage(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;let a=Array(off).fill(0).concat(Array.from({length:days},(_,i)=>i+1));while(a.length%7)a.push(0);const ev=data.transfers.map(t=>({d:new Date(t.date),t})).filter(x=>!isNaN(x.d));return '<div class="heading"><div><h1>Kalendorius</h1><div class="muted">Įrangos perdavimų datos</div></div><button class="primary" onclick="openPerdavimas()">＋ Naujas perdavimas</button></div><div class="panel"><h3>'+n.toLocaleDateString(language==="lt"?"lt-LT":"en-GB",{month:"long",year:"numeric"})+'</h3><div class="calendar">'+["Pr","An","Tr","Kt","Pn","Št","Sk"].map(x=>'<b>'+x+'</b>').join("")+a.map(d=>{let c=ev.filter(x=>x.d.getFullYear()===y&&x.d.getMonth()===m&&x.d.getDate()===d).length;return '<div class="calday '+(d===n.getDate()?"today":"")+'">'+(d||"")+(c?'<small>'+c+' perd.</small>':"")+'</div>'}).join("")+'</div></div><div class="panel" style="margin-top:16px"><h3>Perdavimų istorija</h3>'+ev.sort((x,y)=>y.d-x.d).map(x=>'<div class="event"><span class="dot"></span><div><b>'+x.t.item+'</b><br>'+x.t.from+' → '+x.t.to+'<br>'+fmtDate(x.t.date)+' · '+x.t.by+'</div></div>').join("")+'</div>'}
function showGlobalSearch(){modal("Paieška",'<label>Įrankis, ID, darbuotojas, krepšys, objektas<input id="globalQuery" placeholder="Ieškoti…" oninput="globalResults()"></label><div id="globalResults"></div>',"noop");el("globalQuery").focus();globalResults()}
function noop(){}
function globalResults(){const q=(el("globalQuery")?.value||"").toLowerCase(),a=[];for(const t of data.tools)if((t.name+" "+t.id+" "+t.holder+" "+t.location).toLowerCase().includes(q))a.push(["Įrankis",t.id+" · "+t.name,t.holder+" · "+t.location]);for(const b of data.bags)if((b.name+" "+b.id+" "+b.holder+" "+b.project).toLowerCase().includes(q))a.push(["Krepšys",b.id+" · "+b.name,b.holder]);for(const p of data.projects)if((p.name+" "+p.site+" "+p.lead).toLowerCase().includes(q))a.push(["Objektas",p.name,p.site]);for(const t of data.transfers)if((t.item+" "+t.from+" "+t.to+" "+t.by).toLowerCase().includes(q))a.push(["Perdavimas",t.item,t.from+" → "+t.to+" · "+fmtDate(t.date)]);const r=el("globalResults");if(r)r.innerHTML=a.length?a.map(x=>'<div class="searchhit"><b>'+x[0]+' · '+x[1]+'</b><small>'+x[2]+'</small></div>').join(""):'<div class="empty">Nėra rezultatų</div>'}
\nfunction showBag(id){let b=data.bags.find(x=>x.id===id);alert(b.name+"\nAtsakingas: "+b.holder+"\nVieta: "+b.project+"\nContents: "+(b.items.length?b.items.join(", "):"Įrankiai dar nepriskirti"))}
function showProject(id){let p=data.projects.find(x=>x.id===id);alert(p.name+"\nLead: "+p.lead+"\nKomandos dydis: "+p.people+"\nĮranga: "+(p.items.length?p.items.join(", "):"Įranga dar nepriskirta"))}
render();
</script>
</body></html>

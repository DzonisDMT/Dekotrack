<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>DecoTrack — Equipment control</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:245px;background:#111b2c;color:#d8e1ee;padding:25px 17px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800;color:white;padding:0 9px}.mark{background:#e8a83e;color:#152033;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px 13px;border-radius:9px;font-weight:600}.nav button.active,.nav button:hover{background:#24334a;color:white}.sidefoot{margin-top:auto;color:#8190a7;font-size:12px;padding:10px}.main{flex:1;min-width:0}.top{height:72px;background:white;border-bottom:1px solid #e7ebf1;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.crumb{font-size:14px;color:#68758a}.user{font-size:13px;font-weight:700;background:#eef2f7;padding:9px 12px;border-radius:20px}.content{padding:30px 34px;max-width:1440px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.heading h1{margin:0;font-size:26px;letter-spacing:-.7px}.muted{color:#758197;font-size:13px;margin-top:6px}.primary{border:0;background:#e5a43a;color:#172033;font-weight:800;padding:11px 16px;border-radius:9px}.secondary{border:1px solid #dce2eb;background:white;color:#25334a;padding:10px 13px;border-radius:8px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid #e8ecf2;border-radius:13px;padding:19px}.stat label{font-size:12px;color:#7a879a;font-weight:650}.stat strong{display:block;font-size:29px;margin-top:9px;letter-spacing:-1px}.stat small{color:#8995a6;font-size:12px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}.panel h3{margin:0 0 17px;font-size:15px}.barrow{display:grid;grid-template-columns:105px 1fr 30px;align-items:center;gap:10px;margin:15px 0;font-size:12px;color:#627086}.bar{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#e6a43b;border-radius:10px}.activity{display:grid;gap:15px}.event{display:flex;gap:11px;font-size:12px;color:#68758a;line-height:1.5}.dot{width:9px;height:9px;border-radius:50%;background:#e5a43a;margin-top:4px;flex:none}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1;min-width:150px}.field,input,select{border:1px solid #dce2eb;border-radius:8px;padding:10px 12px;background:white;color:#25334a}.tablewrap{overflow:auto;background:white;border:1px solid #e8ecf2;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #eef1f5;font-size:13px}th{color:#8190a3;font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:#fbfcfe}td{color:#344158}.strong{font-weight:750;color:#1d293d}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:750;background:#edf6f0;color:#348054}.pill.warn{background:#fff5e5;color:#a66a12}.pill.blue{background:#edf3ff;color:#4c70ad}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.asset{background:white;border:1px solid #e8ecf2;border-radius:12px;padding:17px}.asset h3{margin:0 0 7px;font-size:15px}.asset p{margin:0;color:#758197;font-size:12px;line-height:1.7}.asset .meta{margin-top:13px;display:flex;justify-content:space-between;align-items:center}.empty{padding:35px;text-align:center;color:#8490a2}.modalback{position:fixed;inset:0;background:#10182788;display:grid;place-items:center;padding:18px}.modal{background:white;border-radius:15px;padding:22px;width:min(440px,100%);box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 17px}.formgrid{display:grid;gap:12px}.formgrid label{display:grid;gap:6px;font-size:12px;color:#657287;font-weight:700}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.qr{width:70px;height:70px;border:7px solid white;outline:1px solid #dce2eb;background:repeating-conic-gradient(#172033 0 25%,white 0 50%) 0/12px 12px;margin:12px 0}.mobilemenu{display:none}
@media(max-width:900px){.side{width:205px}.content{padding:24px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.shell{display:block}.side{width:100%;padding:13px 14px;gap:12px}.brand{padding:0 5px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.sidefoot{display:none}.top{height:52px;padding:0 17px}.content{padding:22px 14px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:23px}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.cards{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand" style="padding:0 8px"><img src="/assets/decobygg-logo.svg" alt="DEKOBYGG AS" style="display:block;width:174px;height:auto;background:#fff;border-radius:6px;padding:5px"></div><nav class="nav" id="nav">
<button class="active" data-page="Overview">▦ &nbsp; Overview</button><button data-page="Tools">▤ &nbsp; Tools</button><button data-page="Tool bags">▣ &nbsp; Tool bags</button><button data-page="Projects">⌂ &nbsp; Projects</button><button data-page="Transfers">⇄ &nbsp; Transfers</button>
</nav><div class="sidefoot">DEKOBYGG AS<br>Demo workspace · Sample data</div></aside>
<main class="main"><header class="top"><div class="crumb">Workspace / <b id="crumb">Overview</b></div><div class="user">● &nbsp; Demo manager</div></header><section class="content" id="content"></section></main>
</div><div id="modalroot"></div>
<script>
const data={
tools:[
{id:"DT-001",name:"Makita impact driver",category:"Power tools",holder:"Jonas",location:"Project Oslo",status:"In use"},
{id:"DT-002",name:"DeWalt circular saw",category:"Power tools",holder:"Marius",location:"Project Lillestrøm",status:"In use"},
{id:"DT-003",name:"Laser level",category:"Measuring",holder:"Tool room",location:"Warehouse",status:"Available"},
{id:"DT-004",name:"Hilti rotary hammer",category:"Power tools",holder:"Tomas",location:"Project Oslo",status:"In use"},
{id:"DT-005",name:"Festool dust extractor",category:"Dust control",holder:"Tool room",location:"Warehouse",status:"Service due"},
{id:"DT-006",name:"Extension ladder 3.2m",category:"Access",holder:"Eirik",location:"Project Drammen",status:"In use"}
],
bags:[
{id:"BAG-01",name:"Carpenter bag 01",holder:"Jonas",project:"Project Oslo",items:["DT-001","DT-004"]},
{id:"BAG-02",name:"Electrician bag 02",holder:"Marius",project:"Project Lillestrøm",items:["DT-002"]},
{id:"BAG-03",name:"Shared measuring kit",holder:"Tool room",project:"Warehouse",items:["DT-003"]}
],
projects:[
{id:"P-01",name:"Project Oslo",site:"Oslo",lead:"Jonas",people:12,items:["DT-001","DT-004"]},
{id:"P-02",name:"Project Lillestrøm",site:"Lillestrøm",lead:"Marius",people:8,items:["DT-002"]},
{id:"P-03",name:"Project Drammen",site:"Drammen",lead:"Eirik",people:6,items:["DT-006"]}
],
transfers:[{id:"TR-104",item:"DT-002 · DeWalt circular saw",from:"Project Oslo",to:"Project Lillestrøm",by:"Marius",status:"Completed",date:"Today, 08:42"},{id:"TR-103",item:"DT-006 · Extension ladder 3.2m",from:"Warehouse",to:"Project Drammen",by:"Eirik",status:"Completed",date:"Yesterday, 14:10"}]
};
let page="Overview",query="";
function clearSearch(){query="";render()}
const el=id=>document.getElementById(id);
function pill(s){return '<span class="pill '+(s==="Service due"?"warn":s==="Available"?"blue":"")+'">'+s+'</span>'}
function stats(){return '<div class="stats"><div class="stat"><label>TOTAL TOOLS</label><strong>'+data.tools.length+'</strong><small>Registered equipment</small></div><div class="stat"><label>IN USE</label><strong>'+data.tools.filter(x=>x.status==="In use").length+'</strong><small>Assigned to people or sites</small></div><div class="stat"><label>AVAILABLE</label><strong>'+data.tools.filter(x=>x.status==="Available").length+'</strong><small>Ready to be assigned</small></div><div class="stat"><label>NEEDS ATTENTION</label><strong>'+data.tools.filter(x=>x.status==="Service due").length+'</strong><small>Maintenance required</small></div></div>'}
function overview(){return '<div class="heading"><div><h1>Good morning, Manager</h1><div class="muted">Here is what is happening with your equipment today.</div></div><button class="primary" onclick="openAdd()">＋ Add tool</button></div>'+stats()+'<div class="grid2"><div class="panel"><h3>Equipment by location</h3>'+data.projects.map(p=>'<div class="barrow"><span>'+p.site+'</span><div class="bar"><i style="width:'+Math.min(100,p.items.length*25)+'%"></i></div><b>'+p.items.length+'</b></div>').join('')+'<div class="barrow"><span>Warehouse</span><div class="bar"><i style="width:25%"></i></div><b>'+data.tools.filter(t=>t.location==="Warehouse").length+'</b></div></div><div class="panel"><h3>Recent activity</h3><div class="activity">'+data.transfers.slice(0,4).map(t=>'<div class="event"><span class="dot"></span><div><b>'+t.item.split(" · ")[0]+'</b> moved to '+t.to+'<br><span>'+t.date+' · '+t.by+'</span></div></div>').join('')+'</div></div></div>'}
function toolsPage(){let rows=data.tools.filter(t=>(t.name+" "+t.id+" "+t.holder+" "+t.location).toLowerCase().includes(query.toLowerCase()));return '<div class="heading"><div><h1>Tools</h1><div class="muted">Register and find every piece of equipment.</div></div><button class="primary" onclick="openAdd()">＋ Add tool</button></div><div class="toolbar"><input placeholder="Search by tool, ID, employee or location…" value="'+query.replace(/"/g,'&quot;')+'" oninput="query=this.value;renderRows()"><button class="secondary" onclick="clearSearch()">Clear search</button></div><div id="toolrows">'+toolTable(rows)+'</div>'}
function toolTable(rows){return '<div class="tablewrap"><table><thead><tr><th>Tool</th><th>Asset ID</th><th>Assigned to</th><th>Location</th><th>Status</th></tr></thead><tbody>'+rows.map(t=>'<tr><td class="strong">'+t.name+'</td><td>'+t.id+'</td><td>'+t.holder+'</td><td>'+t.location+'</td><td>'+pill(t.status)+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No matching tools found.</div>')+'</div>'}
function renderRows(){let root=el("toolrows");if(root)root.innerHTML=toolTable(data.tools.filter(t=>(t.name+" "+t.id+" "+t.holder+" "+t.location).toLowerCase().includes(query.toLowerCase())))}
function bagsPage(){return '<div class="heading"><div><h1>Tool bags</h1><div class="muted">Numbered kits and the equipment inside each bag.</div></div><button class="primary" onclick="openBag()">＋ New bag</button></div><div class="cards">'+data.bags.map(b=>'<article class="asset"><h3>'+b.name+'</h3><p>Bag ID: '+b.id+'<br>Responsible: '+b.holder+'<br>Location: '+b.project+'</p><div class="meta"><span class="pill blue">'+b.items.length+' tools</span><button class="secondary" onclick="showBag(\''+b.id+'\')">View contents</button></div></article>').join('')+'</div>'}
function projectsPage(){return '<div class="heading"><div><h1>Projects</h1><div class="muted">Equipment and teams at each work site.</div></div><button class="primary" onclick="openProject()">＋ Add project</button></div><div class="cards">'+data.projects.map(p=>'<article class="asset"><h3>'+p.name+'</h3><p>Site: '+p.site+'<br>Project lead: '+p.lead+'<br>Team members: '+p.people+'</p><div class="meta"><span class="pill blue">'+p.items.length+' assigned tools</span><button class="secondary" onclick="showProject(\''+p.id+'\')">View details</button></div></article>').join('')+'</div>'}
function transfersPage(){return '<div class="heading"><div><h1>Transfers</h1><div class="muted">Move equipment between employees, projects and the warehouse.</div></div><button class="primary" onclick="openTransfer()">＋ New transfer</button></div><div class="tablewrap"><table><thead><tr><th>Transfer</th><th>Equipment</th><th>From</th><th>To</th><th>Handled by</th><th>Status</th><th>Date</th></tr></thead><tbody>'+data.transfers.map(t=>'<tr><td>'+t.id+'</td><td class="strong">'+t.item+'</td><td>'+t.from+'</td><td>'+t.to+'</td><td>'+t.by+'</td><td>'+pill(t.status)+'</td><td>'+t.date+'</td></tr>').join('')+'</tbody></table></div>'}
function render(){el("crumb").textContent=page;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));el("content").innerHTML=({Overview:overview,Tools:toolsPage,"Tool bags":bagsPage,Projects:projectsPage,Transfers:transfersPage})[page]()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;query="";render()}));
function modal(title,body,submit){el("modalroot").innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>'+title+'</h2><form class="formgrid" onsubmit="event.preventDefault();('+submit+')()">'+body+'<div class="modalactions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save</button></div></form></div></div>'}
function closeModal(){el("modalroot").innerHTML=""}
function openAdd(){modal("Register a tool",'<label>Tool name<input id="fName" required placeholder="e.g. Makita impact driver"></label><label>Category<input id="fCat" required placeholder="Power tools"></label><label>Assigned to<input id="fHolder" value="Tool room"></label><label>Location<input id="fLoc" value="Warehouse"></label>',"saveTool")}
function saveTool(){let n=el("fName").value;data.tools.unshift({id:"DT-"+String(data.tools.length+1).padStart(3,"0"),name:n,category:el("fCat").value,holder:el("fHolder").value,location:el("fLoc").value,status:"Available"});closeModal();render()}
function openTransfer(){modal("Create equipment transfer",'<label>Tool<select id="fTool">'+data.tools.map(t=>'<option value="'+t.id+'">'+t.id+' · '+t.name+'</option>').join('')+'</select></label><label>From<input id="fFrom" placeholder="Current location"></label><label>To<input id="fTo" required placeholder="Destination project or employee"></label><label>Handled by<input id="fBy" value="Demo manager"></label>',"saveTransfer")}
function saveTransfer(){let t=data.tools.find(x=>x.id===el("fTool").value),to=el("fTo").value,from=el("fFrom").value||t.location;t.location=to;t.holder=to;t.status="In use";data.transfers.unshift({id:"TR-"+(105+data.transfers.length),item:t.id+" · "+t.name,from,to,by:el("fBy").value,status:"Completed",date:"Just now"});closeModal();page="Transfers";render()}
function openBag(){modal("Create tool bag",'<label>Bag name<input id="fBag" required placeholder="e.g. Carpenter bag 04"></label><label>Responsible person<input id="fBagHolder" value="Tool room"></label><label>Location<input id="fBagLoc" value="Warehouse"></label>',"saveBag")}
function saveBag(){data.bags.push({id:"BAG-"+String(data.bags.length+1).padStart(2,"0"),name:el("fBag").value,holder:el("fBagHolder").value,project:el("fBagLoc").value,items:[]});closeModal();render()}
function openProject(){modal("Add project",'<label>Project name<input id="fProject" required placeholder="Project Bergen"></label><label>Site / city<input id="fSite" required placeholder="Bergen"></label><label>Project lead<input id="fLead" placeholder="Employee name"></label><label>Team size<input id="fPeople" type="number" value="1" min="1"></label>',"saveProject")}
function saveProject(){data.projects.push({id:"P-"+String(data.projects.length+1).padStart(2,"0"),name:el("fProject").value,site:el("fSite").value,lead:el("fLead").value,people:Number(el("fPeople").value),items:[]});closeModal();render()}
function showBag(id){let b=data.bags.find(x=>x.id===id);alert(b.name+"\nResponsible: "+b.holder+"\nLocation: "+b.project+"\nContents: "+(b.items.length?b.items.join(", "):"No tools assigned yet"))}
function showProject(id){let p=data.projects.find(x=>x.id===id);alert(p.name+"\nLead: "+p.lead+"\nTeam size: "+p.people+"\nEquipment: "+(p.items.length?p.items.join(", "):"No equipment assigned yet"))}
render();
</script>
</body></html>
